    </g>
    <rect x="384" y="336" width="26" height="34" fill="#E8A33D" opacity="0.9"/>
  </g>
  <!-- big brackets -->
  <g font-family="Tahoma, sans-serif" font-size="200" font-weight="bold" fill="none" stroke="#4ADE80" stroke-width="6" opacity="0.5">
