  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#FAF8F1" stroke-width="3"/>
  <line x1="48" y1="470" x2="1152" y2="470" stroke="#FAF8F1" stroke-width="2" opacity="0.6"/>
  <text x="1050" y="140" font-family="Tahoma, sans-serif" font-size="30" font-weight="bold" fill="#E8A33D" text-anchor="end">برنامه‌نویسی • شی‌گرایی • ساختمان داده</text>
