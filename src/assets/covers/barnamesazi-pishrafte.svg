    <circle cx="194" cy="120" r="9" fill="#FAF8F1" opacity="0.35"/>
    <g opacity="0.8">
      <rect x="120" y="180" width="180" height="14" rx="7" fill="#4ADE80" opacity="0.7"/>
      <rect x="120" y="212" width="260" height="14" rx="7" fill="#FAF8F1" opacity="0.35"/>
