<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="جلد دوره مدار منطقی">
  <rect width="1200" height="630" fill="#FAF8F1"/>
  <!-- circuit traces -->
  <g fill="none" stroke="#166534" stroke-width="3" opacity="0.55">
    <path d="M80 120 H 260 V 200 H 380"/>
    <path d="M80 200 H 200 V 300 H 380"/>
    <path d="M80 300 H 150 V 380 H 380"/>
    <path d="M820 200 H 980 V 120 H 1120"/>
    <path d="M820 300 H 1020 V 220"/>
    <path d="M820 380 H 960 V 300 H 1120"/>
  </g>
  <g fill="#92400E">
    <circle cx="80" cy="120" r="10"/>
    <circle cx="80" cy="200" r="10"/>
    <circle cx="80" cy="300" r="10"/>
    <circle cx="1120" cy="120" r="10"/>
    <circle cx="1120" cy="300" r="10"/>
    <circle cx="260" cy="160" r="7"/>
    <circle cx="980" cy="160" r="7"/>
  </g>
  <!-- AND gate -->
  <g transform="translate(430 170)">
    <path d="M0 0 H 90 V 130 H 0 Z M90 0 H 110 A 65 65 0 0 1 110 130 H 90" fill="none" stroke="#1C1917" stroke-width="6"/>
    <line x1="-40" y1="35" x2="0" y2="35" stroke="#1C1917" stroke-width="6"/>
    <line x1="-40" y1="95" x2="0" y2="95" stroke="#1C1917" stroke-width="6"/>
    <line x1="175" y1="65" x2="225" y2="65" stroke="#1C1917" stroke-width="6"/>
    <circle cx="235" cy="65" r="10" fill="#92400E"/>
    <text x="87" y="90" font-family="Tahoma, sans-serif" font-size="52" font-weight="bold" fill="#1C1917" text-anchor="middle">&amp;</text>
  </g>
  <!-- OR gate -->
  <g transform="translate(700 300)">
    <path d="M0 0 Q 70 0 110 65 Q 70 130 0 130 Q 30 65 0 0 Z" fill="#166534" opacity="0.14"/>
    <path d="M0 0 Q 70 0 110 65 Q 70 130 0 130 Q 30 65 0 0 Z" fill="none" stroke="#166534" stroke-width="6"/>
    <text x="55" y="88" font-family="Tahoma, sans-serif" font-size="48" font-weight="bold" fill="#166534" text-anchor="middle">≥1</text>
  </g>
  <!-- binary ticks -->
  <g font-family="Tahoma, sans-serif" font-size="26" fill="#57534E" opacity="0.7" text-anchor="middle" direction="ltr">
    <text x="200" y="440">1 0 1 1 0</text>
    <text x="1000" y="440">0 1 1 0 1</text>
  </g>
  <!-- frame -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#1C1917" stroke-width="3"/>
  <line x1="48" y1="470" x2="1152" y2="470" stroke="#1C1917" stroke-width="2" opacity="0.4"/>
  <text x="1050" y="250" font-family="Tahoma, sans-serif" font-size="96" font-weight="900" fill="#1C1917" text-anchor="end">مدار منطقی</text>
  <text x="1050" y="330" font-family="Tahoma, sans-serif" font-size="40" font-weight="bold" fill="#92400E" text-anchor="end">گیت‌ها و سیستم‌های دیجیتال</text>
  <text x="1050" y="415" font-family="Tahoma, sans-serif" font-size="34" fill="#57534E" text-anchor="end">وب‌سایت آموزشی تعاملی</text>
  <text x="600" y="560" font-family="Tahoma, sans-serif" font-size="30" fill="#57534E" text-anchor="middle">study.danialrashidi.ir</text>
</svg>
